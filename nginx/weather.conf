server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /var/www/weather;
    index index.html;

    # Anti-indexing headers for search engines
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Webpage Password Protection (generate via: htpasswd -bc /etc/nginx/.htpasswd <user> <pass>)
    auth_basic "HyperLocal Meteorological Engine";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow robots.txt without auth so crawlers immediately read Disallow: /
    location = /robots.txt {
        auth_basic off;
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
